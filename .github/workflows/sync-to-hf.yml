name: Sync to HuggingFace Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-hf
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HuggingFace Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "${HF_TOKEN}" ]; then
            echo "::error::HF_TOKEN secret is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          git push --force \
            "https://jatuns:${HF_TOKEN}@huggingface.co/spaces/jatuns/musicmatch.git" \
            HEAD:main
